name: 'AwsDestroy'

on:  
  workflow_call:
    inputs:
      initiative:
        type: string
        required: true
      environment:
        type: string
        required: true
      service_name:
        type: string
        required: false
      revision:
        type: string
        required: false
      git_organization:
        type: string
        required: true
      git_organization_id:
        type: string
        required: true
      aws_bucket_prefix:
        type: string
        required: true    
      aws_region:
        type: string
        required: true
        description: Region where to run Terraform script
    secrets:
      shared_client_id:
        required: true
      shared_secret:
        required: true
      aws_github_role:
        required: true
        description: Role to be used to run Terraform script
      aws_main_role:
        required: true
        description: Role to be used to run Terraform script
      aws_admin_role:
        required: true
        description: Additional role to access AWS Core Account  

permissions:
  contents: read
  id-token: write

jobs:
  
  terraform-destroy:
    runs-on: ubuntu-latest

    steps:
    - id: checkout
      name: checkout
      uses: actions/checkout@v7
      
    - name: "Terraform Destroy"
      uses: cailleach-devops/aws-shared-actions/.github/actions/tf/tf-destroy@main
      with:
        aws_bucket_prefix: ${{ inputs.aws_bucket_prefix }}
        aws_admin_role: ${{ secrets.aws_admin_role }}
        aws_github_role: ${{ secrets.aws_github_role }}
        aws_main_role: ${{ secrets.aws_main_role }}
        aws_region: ${{ inputs.aws_region }}
        shared_client_id: ${{ secrets.shared_client_id }}
        shared_secret: ${{ secrets.shared_secret }}
        is_infra_script: false
        initiative: ${{ inputs.initiative }}
        environment: ${{ inputs.environment }}
        git_organization: ${{ inputs.git_organization }}
        git_organization_id: ${{ inputs.git_organization_id }}
        service_name: ${{ inputs.service_name }}
        revision: ${{ inputs.revision }}